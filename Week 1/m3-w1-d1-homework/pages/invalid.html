<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invalid Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fdeeee;
      color: #333;
      margin: 0;
      padding: 60px 40px;
      text-align: center;
    }
    h1 {
      color: #c01c28;
      font-size: 2.5rem;
    }
    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 20px auto;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background-color: #c01c28;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
    a:hover {
      background-color: #9a1620;
    }
  </style>
</head>
<body>
  <h1>Invalid Request!</h1>
  <p>Sorry, the page you asked for does not exist. Please check the URL and try again.</p>
  <a href="/">Back to Home</a>

</html>
