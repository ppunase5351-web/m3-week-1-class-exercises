<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <style>
    /* Shared design: identical on home, about and contact pages.
       Only --accent changes per page. */
    :root {
      --accent: #2f5bd8;
      --ink: #1f2a37;
      --muted: #5b6673;
      --paper: #f6f8fb;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 32px 40px;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2.4rem;
      line-height: 1.1;
      color: var(--accent);
    }
    p {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>Contact</h1>
  <p>Welcome to the contact page!</p>
</body>
</html>
